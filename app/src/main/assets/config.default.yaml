# CLIProxyAPI 手机端默认配置 (v8)
# 配置文件位置: 应用私有安全沙箱或 /sdcard/Download/CLIProxyAPI/config.yaml

config-version: 8

server:
  host: ""
  port: 8317
  tls:
    enable: false

management:
  allow-remote: true
  secret-key: "$2a$10$CB6gsUwcpjYlfotj1zySPuAdYAYjpDsjcGcdenm/eN.i4wjiBGwGy"
  disable-control-panel: false
  panel-github-repository: "https://github.com/router-for-me/Cli-Proxy-API-Management-Center"

# 授权凭据持久化存储目录
auth-dir: "/sdcard/Download/CLIProxyAPI/auth"

# 访问 API 密钥
api-keys:
  - "sk-cliproxy-default"

debug: false
