apply plugin: 'com.android.application'
android {
    namespace 'com.cliproxy.app'
    compileSdk 34
    defaultConfig {
        applicationId "com.cliproxy.app"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.1.0"
    }
    signingConfigs {
        release {
            storeFile file('cliproxy.keystore')
            storePassword 'cliproxy123'
            keyAlias 'cliproxy'
            keyPassword 'cliproxy123'
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            packagingOptions { jniLibs { useLegacyPackaging = true } }
        }
        debug {
            // 确保native libs被提取到文件系统（有执行权限）
            packagingOptions { jniLibs { useLegacyPackaging = true } }
        }
    }
    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(':core')
}
